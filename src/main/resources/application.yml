spring:
  application:
    name: fundamental
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-claim-name: roles
          authority-prefix: ROLE_
          
rsa:
  private-key-location: file:/run/keys/private.pem
  public-key-location: file:/run/keys/public.pem

jwt:
  issuer: fundamental
  access-ttl:15m
  refresh-ttl:7d